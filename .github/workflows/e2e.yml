name: E2E

# Playwright e2e suite (e2e/tests). Unlike the rest of CI, this needs a
# reachable OpenMRS backend and login credentials to pass — global-setup.ts
# logs in and writes e2e/storage-state.json. Until those are configured as
# repo secrets/vars (see the `env:` block below), keep this OUT of the
# required checks and run it on demand or per-PR via the `e2e` label.
#
# To make it run on every push to main, uncomment the `push:` trigger once the
# secrets exist.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
    branches: [main]
  # push:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IBM_TELEMETRY_DISABLED: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # Always exercise the SPA built from this SHA; only the backend is remote.
  E2E_BASE_URL: http://127.0.0.1:8080/openmrs/spa
  E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
  E2E_GATE_TARGET: ${{ vars.E2E_GATE_TARGET }}
  E2E_LOGIN_DEFAULT_LOCATION_UUID: ${{ vars.E2E_LOGIN_DEFAULT_LOCATION_UUID }}
  E2E_PATIENT_UUID: ${{ vars.E2E_PATIENT_UUID }}
  E2E_APPOINTMENTS_PATIENT_UUID: ${{ vars.E2E_APPOINTMENTS_PATIENT_UUID }}
  # Login used by global-setup.ts (repo Secrets).
  E2E_USER_ADMIN_USERNAME: ${{ secrets.E2E_USER_ADMIN_USERNAME }}
  E2E_USER_ADMIN_PASSWORD: ${{ secrets.E2E_USER_ADMIN_PASSWORD }}
  SIHSALUS_BACKEND_URL: ${{ vars.E2E_API_BASE_URL }}
  SIHSALUS_DEV_APPS: "none"
  SIHSALUS_REQUIRE_BACKEND_URL: "true"
  GIT_SHA: ${{ github.sha }}
  E2E_FIXTURE_EXPECTED_SHA: ${{ github.sha }}
  E2E_NATIVE_SUPERVISED_TARGET: ${{ vars.E2E_GATE_TARGET }}
  E2E_FIXTURE_IDENTIFIER_SOURCE_UUID: ${{ vars.E2E_FIXTURE_IDENTIFIER_SOURCE_UUID }}
  E2E_FIXTURE_IDENTIFIER_TYPE_UUID: ${{ vars.E2E_FIXTURE_IDENTIFIER_TYPE_UUID }}
  E2E_FIXTURE_VISIT_TYPE_UUID: ${{ vars.E2E_FIXTURE_VISIT_TYPE_UUID }}
  E2E_FIXTURE_REQUIRED_PRIVILEGES: ${{ vars.E2E_FIXTURE_REQUIRED_PRIVILEGES }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
      - name: Validate E2E contracts
        run: yarn test:e2e:contracts

  e2e:
    # Only run for push/dispatch, or for PRs explicitly labeled `e2e`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Laboratory stays manual until its fixture journals have private,
        # durable recovery retention. Its CI preflight deliberately rejects CI.
        suite: [clinical]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-env

      - name: Validate isolated E2E configuration
        shell: bash
        run: |
          missing=0
          for name in \
            E2E_API_BASE_URL \
            E2E_GATE_TARGET \
            E2E_LOGIN_DEFAULT_LOCATION_UUID \
            E2E_PATIENT_UUID \
            E2E_APPOINTMENTS_PATIENT_UUID \
            E2E_USER_ADMIN_USERNAME \
            E2E_USER_ADMIN_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for the clinical E2E gate."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Playwright browser (chromium)
        run: yarn playwright install --with-deps chromium

      - name: Configure private fixture checkpoint connection
        env:
          CHECKPOINT_KEY: ${{ secrets.E2E_JOURNAL_PRIVATE_KEY }}
          CHECKPOINT_HOSTS: ${{ vars.E2E_JOURNAL_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CHECKPOINT_KEY" || -z "$CHECKPOINT_HOSTS" ]]; then
            echo '::error::Private DEV journal retention must be reviewed and configured before clinical writes.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/e2e-checkpoint-key"
          hosts_file="$RUNNER_TEMP/e2e-checkpoint-known-hosts"
          printf '%s\n' "$CHECKPOINT_KEY" > "$key_file"
          printf '%s\n' "$CHECKPOINT_HOSTS" > "$hosts_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          {
            echo "E2E_JOURNAL_KEY_FILE=$key_file"
            echo "E2E_JOURNAL_KNOWN_HOSTS_FILE=$hosts_file"
          } >> "$GITHUB_ENV"

      - name: Build and assemble SPA
        run: yarn package:spa

      # Playwright's webServer config starts `yarn start` and waits for the
      # login page before running the suite.
      - name: Run E2E tests
        run: yarn test:e2e:suite ${{ matrix.suite }}

      - name: Remove temporary checkpoint credentials
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/e2e-checkpoint-key" "$RUNNER_TEMP/e2e-checkpoint-known-hosts"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 7
