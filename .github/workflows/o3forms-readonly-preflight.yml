name: O3 Forms read-only DEV preflight

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: o3forms-readonly-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    if: >-
      github.repository == 'sihsalus/sihsalus-frontend' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'o3forms-dev-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read authenticated technical metadata (no clinical data or writes)
        env:
          O3FORMS_READONLY_PREFLIGHT: "true"
          E2E_GATE_TARGET: DEV
          O3FORMS_PREFLIGHT_ORIGIN: https://gidis-hsc-dev.inf.pucp.edu.pe
          E2E_IGNORE_HTTPS_ERRORS: "true"
          E2E_USER_ADMIN_USERNAME: ${{ secrets.E2E_USER_ADMIN_USERNAME }}
          E2E_USER_ADMIN_PASSWORD: ${{ secrets.E2E_USER_ADMIN_PASSWORD }}
        run: node e2e/scripts/o3forms-environment-preflight.mjs
