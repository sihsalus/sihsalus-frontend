vulnerabilities:
  - id: GHSA-qwww-vcr4-c8h2
    purls:
      - pkg:npm/react-router@7.18.2
    expired_at: 2026-08-31
    statement: >-
      React Router 7.18.2 contains the official v7 CSRF backport; GitHub/npm
